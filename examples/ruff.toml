# A more foregiving version for the examples

target-version = "py310"
lint.select = [
    "F",  # pyflakes
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "I",  # isort
    "A",  # flake8 builtins
    "NPY",  # numpy
    "RUF",
]

lint.ignore = [
    "E741",
   ]

extend-include = ["*.ipynb"]
